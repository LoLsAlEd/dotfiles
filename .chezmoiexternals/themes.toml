[".config/atuin/themes"]
type = "archive"
url = "https://github.com/catppuccin/atuin/archive/main.tar.gz"
exact = true
stripComponents = 3
refreshPeriod = "168h"
include = ["*/themes/**"]

[".config/bat/themes"]
type = "archive"
url = "https://github.com/catppuccin/bat/archive/main.tar.gz"
exact = true
stripComponents = 2
refreshPeriod = "168h"
include = ["*/themes/*.tmTheme"]

[".config/eza/theme.yml"]
type = "file"
url = "https://raw.githubusercontent.com/catppuccin/eza/main/themes/mocha/catppuccin-mocha-mauve.yml"
refreshPeriod = "168h"

[".config/micro/colorschemes"]
type = "archive"
url = "https://github.com/catppuccin/micro/archive/main.tar.gz"
exact = true
stripComponents = 2
refreshPeriod = "168h"
include = ["*/themes/**"]
# set colorscheme catppuccin-mocha
